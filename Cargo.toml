[package]
name = "pinkeybd-rmk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "RMK firmware for Pinkeybd"

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "7104e10926a84e0fb4a7be50946680dae8f2819b", default-features = false, features = ["defmt", "storage", "watchdog", "nrf52840_ble", "split"] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = ["defmt", "peripheral", "central", "nrf52840"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = ["defmt", "critical-section-impl", "nrf52840"] }
bt-hci = { version = "0.9", features = ["defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "nfc-pins-as-gpio", "time"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[[bin]]
name = "pinkeybd-left"
path = "src/peripheral.rs"

[[bin]]
name = "pinkeybd-right"
path = "src/central.rs"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
lto = "fat"
panic = "abort"
